<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aahar-Parampara | QR Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="desktop-landing">
    <div class="particles" id="particles"></div>
    <div class="landing-container">
        <header class="landing-header">
            <h1 class="brand-title">Aahar-Parampara</h1>
            <p class="brand-subtitle">Discover India's Forgotten Food Heritage</p>
        </header>

        <main class="qr-showcase">
            <div class="qr-frame">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                
                <img id="dynamic-qr" src="" alt="Aahar-Parampara QR Code" />
            </div>
            
            <div class="scan-instructions">
                <h2>SCAN TO DISCOVER A RANDOM HERITAGE FOOD</h2>
                <p>Every scan unlocks a story preserved through generations.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
